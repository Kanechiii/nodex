name: Security and Python checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q main.py algorithms models structures tests scripts
      - name: Run core and console tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run BFS and DFS checks
        run: python -m unittest discover -s tests -p '*_check.py' -v
      - name: Audit source and Git history
        run: python scripts/security_audit.py
      - name: Audit historical bytecode and contributor metadata
        run: python scripts/history_privacy_audit.py
